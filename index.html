<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Harshit Pandey’s portfolio of microelectronics and robotics projects.">
  <title>My Projects | Harshit Pandey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hero" aria-label="Portfolio introduction">
      <img src="assets/images/portfolio-hero.gif" alt="Animated portfolio montage of Harshit Pandey" width="720" height="405" fetchpriority="high">
    </section>
    <section class="intro" aria-labelledby="projects-title">
      <img class="robot" src="assets/images/robot.png" alt="A friendly robot peeking around the page" width="848" height="1103">
      <div class="paper">
        <h1 id="projects-title">My Projects</h1>
        <p class="subtitle">things i am proud of</p>
        <p class="bio">I am Harshit Pandey,<br>Microelectronics student</p>
        <img class="portrait" src="assets/images/harshit-pandey.png" alt="Harshit Pandey" width="479" height="609">
      </div>
    </section>
    <section class="projects" aria-label="Project posters">
      <div class="gallery">
        <figure><img src="assets/images/hexarover.png" alt="HexaRover: six-wheel robotics project poster with components and QR code" width="338" height="480" loading="lazy"></figure>
        <figure><img src="assets/images/cloudie.png" alt="Cloudie: DIY remote-controlled plane project poster with labelled parts and QR code" width="338" height="480" loading="lazy"></figure>
      </div>
    </section>
    <p class="note">*there are a lot of photos of mine, please don't mind them</p>
  </main>
</body>
</html>
